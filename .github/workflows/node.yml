name: "Build and Test"
on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build the project
        run: npm run build
      - name: Run tests
        run: npm run test
      - name: Run linter
        run: npm run lint:check
      - name: Check code formatting
        run: npm run format:check
      - name: Pack the package
        run: npm pack
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: muzzle-package
          path: ./*.tgz

  publish-npm:
    runs-on: ubuntu-latest
    environment: npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build the project
        run: npm run build
      - run: npm install npm@11 -g # Use npm@11 to publish with OIDC
      - run: |
          Copy-Item LICENSE @binkylabs/muzzle/ -Verbose
          Copy-Item README.md @binkylabs/muzzle/ -Verbose
          Copy-Item CHANGELOG.md @binkylabs/muzzle/ -Verbose
        shell: pwsh
      - name: Publish package on NPM
        run: npm publish --access public --provenance --workspaces
